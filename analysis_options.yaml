include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Archived pre-MVP prototype; does not compile and is not part of the app.
    - archive/**
    # Third-party reference/tooling submodules.
    - tools/**
    # Throwaway Phase 0 transport spike has its own analysis.
    - spikes/**
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - prefer_single_quotes
    - always_declare_return_types
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
